bots:
  # Bypass: API routes / webhooks skip the challenge entirely
  #- name: api-bypass
  #  path_regex: "^/api/"
  #  action: ALLOW

  # - name: webhook-bypass
  #   path_regex: "^/webhooks/"
  #   action: ALLOW

  # Deny known pathological / hostile bots outright
  - import: "(data)/bots/_deny-pathological.yaml"

  # Deny known AI scrapers/crawlers aggressively
  - import: "(data)/meta/ai-block-aggressive.yaml"

  - import: "(data)/common/keep-internet-working.yaml"

  - name: generic-browser
    user_agent_regex: "Mozilla|Opera"
    action: CHALLENGE
    challenge:
      algorithm: fast
      difficulty: 4

  - name: catch-all-non-browser
    expression: "true"
    action: DENY

dnsbl: false

status_codes:
  CHALLENGE: 200
  DENY: 200

